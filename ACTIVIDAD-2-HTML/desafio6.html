<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario de Registros</title>

        <style>
            body{
                font-family: Arial, sans-serif;
                background: #f4f6f9;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .form-container{
                background: white;
                padding: 25px;
                border-radius: 12px;
                width: 100%;
                max-width: 420px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            }
            h2{
                text-align: center;
                margin-bottom: 20px;
                color: #333;

            }
            label {
                display: block;
                margin-top: 12px;
                font-weight: bold;
                color: #444;
            }
            input, select, textarea {
                width: 100%;
                padding: 10px;
                margin-top: 5px;
                border: 1px solid #ccc;
                border-radius: 8px;
                outline: none;
                transition: 0.2s;
            }
            input:focus, textarea:focus, select:focus {
                border-color: #4a90e2;
            }
            .sexo {
                margin-top: 8px;
            }
            .sexo label{
                display: block;
                margin-bottom: 5px;
            }
            button {
                width: 100px;
                margin-top: 20px;
                padding: 12px;
                background: #4a90e2;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s;

            }

            button:hover {
                background: #357ab8;
            }
            .password-container {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .password-container input{
                flex: 1;
            }
            .password-container button {
                width: auto;
                padding: 8px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>

    <div class="form-container">
        <h2>Registro de Usuario</h2>

        <form>
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" value="Rodrigo Molinas" required>

            <label for="email">Correo electronico</label>
            <input type="email" id="email" name="email" value="rodriigom@gmail.com" required>

            <label for="password">Contraseña</label>
            <div class="password-container">
            <input type="password" id="password" name="password" value="123456789" required>
            <button type="button" onclick="togglePassword()">👁️</button>
            </div>

            <label>Sexo</label>
            <div class="sexo">
                <label><input type="radio" name="sexo" value="masculino">Masculino</label>
                <label><input type="radio" name="sexo" value="Femenino">Femenino</label>
                <label><input type="radio" name="sexo" value="otro">Otro</label>
            </div>

                <label for="comentarios">Comentarios</label>
                <textarea id="comentarios" name="comentarios" rows="4" value="Soy estudiante y este es mi formulario."></textarea>

                <button type="submit">Enviar</button>

        </form>
    </div>
    <script>
        function togglePassword(){
            const input = document.getElementById("password");

            if (input.type === "password"){
                input.type = "text";
            } else {
                input.type = "password";

            }
        }

    </script>



</body>
</html>
